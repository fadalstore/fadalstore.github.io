{% if site.adsense == "enabled" and site.adsense_data_ad_client != "ca-pub-xxxxxxxxxxxxxxxx" %}
<div class="adsense-wrap my-3">

<ins class="adsbygoogle"
    style="display:block"
    data-ad-client="{{site.adsense_data_ad_client}}"
    data-ad-slot="{{site.adsense_data_ad_slot}}"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>
{% endif %}
